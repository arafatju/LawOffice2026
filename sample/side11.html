<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .sidebar {
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            background-color: #1a237e !important;
            color: white;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .sidebar {
                margin-left: -250px;
            }

            .sidebar.active {
                margin-left: 0;
            }

            .content {
                width: 100%;
            }
        }

        .sidebar-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 12px 15px;
            display: block;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-left: 3px solid #fff;
        }

        .sidebar-link i {
            margin-right: 10px;
        }

        .content {
            min-height: 100vh;
            transition: all 0.3s;
        }

        .user-profile {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin-top: auto;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .breadcrumb-item + .breadcrumb-item::before {
            content: ">";
        }

        .nav-section {
            flex: 1;
        }

        .app-title {
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-profile .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar" style="width: 250px;" id="sidebar">
        <!-- Logo/Brand -->
        <div class="p-3 app-title">
            <h4 class="m-0">Welcome to Notary</h4>
        </div>

        <!-- Navigation Menu -->
        <div class="nav-section py-3">
            <a href="dashboard.html" class="sidebar-link  ">
                <i class="bi bi-house-door"></i> Dashboard
            </a>
            <a href="users.html" class="sidebar-link">
                <i class="bi bi-people"></i> Users
            </a>
            <a href="products.html" class="sidebar-link">
                <i class="bi bi-box"></i> Products
            </a>
            <a href="settings.html" class="sidebar-link">
                <i class="bi bi-gear"></i> Settings
            </a>
        </div>

        <!-- User Profile - Now at bottom -->
        <div class="user-profile">
        <div class="dropdown d-flex align-items-center">
                    <button class="btn btn-link text-dark dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="login.html">Logout</a></li>
                    </ul>
                </div>
            <div class="d-flex align-items-center">
                <img src="https://ui-avatars.com/api/?name=John+Doe&background=random" 
                     alt="Profile" 
                     class="rounded-circle me-2"
                     style="width: 40px; height: 40px;">
                <div>
                    <div class="fw-bold">John Doe</div>
                    <small class="text-muted">john@example.com</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content flex-grow-1 bg-light">
        <!-- Top Navigation Bar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <!-- Sidebar Toggle Button -->
                <button class="btn btn-link d-md-none" id="sidebarToggle">
                    <i class="bi bi-list fs-5"></i>
                </button>

                <!-- Breadcrumbs -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item">
                            <a href="dashboard.html">
                                <i class="bi bi-house-door"></i>
                            </a>
                        </li>
                        <li class="breadcrumb-item active">Dashboard</li>
                    </ol>
                </nav>

                <!-- User Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-link text-dark dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="profile.html">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="login.html">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="p-4">
            <!-- Your content here -->
            <h2>Dashboard</h2>
            <p>Welcome to your dashboard.</p>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Sidebar Toggle
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');

    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function() {
            sidebar.classList.toggle('active');
        });
    }

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', function(event) {
        if (window.innerWidth <= 768) {
            const isClickInsideSidebar = sidebar.contains(event.target);
            const isClickInsideToggle = sidebarToggle.contains(event.target);

            if (!isClickInsideSidebar && !isClickInsideToggle && sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
            }
        }
    });

    // Adjust sidebar on window resize
    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) {
            sidebar.classList.remove('active');
        }
    });
});
</script>

</body>
</html>
