<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            min-height: 100vh;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            padding: 12px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            border-color: #6366f1;
        }
        .social-login {
            border: 1px solid #dee2e6;
            border-radius: 50px;
            padding: 10px 20px;
            transition: all 0.3s;
        }
        .social-login:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="login-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="login-card p-4">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Welcome Back!</h2>
                            <p class="text-muted">Please login to your account</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label" for="remember">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="text-decoration-none">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-custom text-white w-100 mb-4">Sign In</button>

                            <div class="text-center mb-4">
                                <p class="text-muted mb-4">Or Sign In with</p>
                                <div class="d-flex justify-content-center gap-3">
                                    <a href="#" class="social-login text-decoration-none">
                                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/icons/google.svg" alt="Google">
                                    </a>
                                    <a href="#" class="social-login text-decoration-none">
                                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/icons/facebook.svg" alt="Facebook">
                                    </a>
                                    <a href="#" class="social-login text-decoration-none">
                                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/icons/twitter.svg" alt="Twitter">
                                    </a>
                                </div>
                            </div>

                            <div class="text-center">
                                <p class="mb-0">Don't have an account? 
                                    <a href="register.html" class="text-decoration-none">Sign Up</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your login logic here
            console.log('Login submitted');
        });
    </script>
</body>
</html>
