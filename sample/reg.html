
<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register-container {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            min-height: 100vh;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            padding: 12px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            border-color: #6366f1;
        }
        .social-login {
            border: 1px solid #dee2e6;
            border-radius: 50px;
            padding: 10px 20px;
            transition: all 0.3s;
        }
        .social-login:hover {
            background: #f8f9fa;
        }
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="register-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="register-card p-4">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Create Account</h2>
                            <p class="text-muted">Get started with your free account</p>
                        </div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                                <div class="password-strength bg-light" id="passwordStrength"></div>
                                <small class="text-muted">Must be at least 8 characters long</small>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                            </div>

                            <button type="submit" class="btn btn-custom text-white w-100 mb-4">Create Account</button>

                            <div class="text-center mb-4">
                                <p class="text-muted mb-4">Or Sign Up with</p>
                                <div class="d-flex justify-content-center gap-3">
                                    <a href="#" class="social-login text-decoration-none">
                                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/icons/google.svg" alt="Google">
                                    </a>
                                    <a href="#" class="social-login text-decoration-none">
                                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/icons/facebook.svg" alt="Facebook">
                                    </a>
                                    <a href="#" class="social-login text-decoration-none">
                                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/icons/twitter.svg" alt="Twitter">
                                    </a>
                                </div>
                            </div>

                            <div class="text-center">
                                <p class="mb-0">Already have an account? 
                                    <a href="login.html" class="text-decoration-none">Sign In</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your registration logic here
            console.log('Registration submitted');
        });

        // Password strength indicator
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strength = document.getElementById('passwordStrength');
            const width = Math.min(password.length * 10, 100);
            
            if (password.length === 0) {
                strength.style.width = '0%';
                strength.style.backgroundColor = '#e9ecef';
            } else if (password.length < 4) {
                strength.style.width = width + '%';
                strength.style.backgroundColor = '#dc3545';
            } else if (password.length < 8) {
                strength.style.width = width + '%';
                strength.style.backgroundColor = '#ffc107';
            } else {
                strength.style.width = '100%';
                strength.style.backgroundColor = '#198754';
            }
        });
    </script>
</body>
</html>
